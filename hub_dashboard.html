<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowSync Hub — Realtime Dispatch Dashboard</title>
    <!-- 🔐 Offizielles, stabiles Supabase-JS SDK via jsDelivr CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #121214;
            color: #e1e1e6;
            margin: 0;
            padding: 30px;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #29292e;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        h1 { margin: 0; color: #04d361; font-size: 28px; }
        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            background: #29292e;
            color: #a8a8b3;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-online { color: #04d361; border: 1px solid #04d361; }
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        .panel {
            background: #202024;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid #29292e;
        }
        h2 { margin-top: 0; color: #4da6ff; font-size: 20px; }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            margin-top: 15px;
        }
        th {
            color: #7c7c8a;
            font-size: 14px;
            padding: 12px 8px;
            border-bottom: 2px solid #29292e;
        }
        td {
            padding: 12px 8px;
            border-bottom: 1px solid #29292e;
            font-size: 15px;
        }
        tr:hover { background: #29292e; }
        .badge-type {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            background: #121214;
        }
        .type-inbound { color: #04d361; }
        .type-loading { color: #ff9000; }
    </style>
</head>
<body>

<div class="header-bar">
    <h1>FlowSync Dispatch Hub</h1>
    <div class="status-badge status-online" id="hubStatus">⚡ REALTIME SYNC: Initialisiere...</div>
</div>

<div class="dashboard-grid">
    <div class="panel">
        <h2>Live Warenumschlag (Letzte 10 Scans)</h2>
        <table>
            <thead>
                <tr>
                    <th>Zeitstempel</th>
                    <th>Geräte-ID</th>
                    <th>Aktivität</th>
                    <th>Barcode / ID</th>
                </tr>
            </thead>
            <tbody id="liveScanRows">
                <!-- Neue Zeilen werden hier live per JavaScript reingepusht -->
            </tbody>
        </table>
    </div>
</div>
<script>
    // 🔐 GESTÄRKTER ENTERPRISE-SCHUTZ: Keine Klartext-Schlüssel auf GitHub!
    let supabaseClient = null;
    
    const liveScanRows = document.getElementById("liveScanRows");
    const hubStatus = document.getElementById("hubStatus");

    async function fetchSecureConfig() {
        try {
            const response = await fetch("/api/v1/hub/config");
            if (!response.ok) throw new Error("Schlüssel-Injektion fehlgeschlagen");
            
            const config = await response.json();
            
            // 🛡️ ULTRA-ROBUSTER FALLBACK: Akzeptiert sowohl Unterstriche als auch CamelCase
            const targetUrl = config.supabase_url || config.supabaseUrl;
            const targetKey = config.supabase_key || config.supabaseKey;
            
            if (!targetUrl || !targetKey) {
                throw new Error("Datenstruktur der Schlüssel fehlerhaft");
            }
            
            // Initialisiert den Supabase-Client im geschützten Browser-Speicher
            supabaseClient = supabase.createClient(targetUrl, targetKey);
            
            initializeRealtimeHub();
        } catch (err) {
            hubStatus.innerText = "❌ CONFIG ERROR: Schlüssel verweigert";
            hubStatus.style.borderColor = "#f75a68";
            hubStatus.style.color = "#f75a68";
        }
    }

    function appendLiveRow(scan) {
        const row = document.createElement("tr");
        const scanTime = new Date(scan.timestamp).toLocaleTimeString();
        
        let typeClass = "type-inbound";
        if (scan.scan_type === "BELADUNG") {
            typeClass = "type-loading";
        }

        row.innerHTML = `
            <td style="color: #7c7c8a;">${scanTime}</td>
            <td style="font-family: monospace;">${scan.device_id}</td>
            <td><span class="badge-type ${typeClass}">${scan.scan_type}</span></td>
            <td style="font-weight: bold; color: #fff;">${scan.barcode}</td>
        `;

        liveScanRows.insertBefore(row, liveScanRows.firstChild);

        if (liveScanRows.children.length > 10) {
            liveScanRows.removeChild(liveScanRows.lastChild);
        }
    }
    // ==============================================================================
    // 🔌 SUPABASE REALTIME WEB-SOCKET SUBSCRIPTION
    // ==============================================================================
    async function initializeRealtimeHub() {
        if (!supabaseClient) return;

        supabaseClient
            .channel("public:scan_events")
            .on(
                "postgres_changes",
                { event: "INSERT", schema: "public", table: "scan_events" },
                function(payload) {
                    appendLiveRow(payload.new);
                }
            )
            .subscribe(function(status) {
                if (status === "SUBSCRIBED") {
                    hubStatus.innerText = "⚡ REALTIME SYNC: Verbunden";
                    hubStatus.style.borderColor = "#04d361";
                    hubStatus.style.color = "#04d361";
                } else if (status === "CHANNEL_ERROR" || status === "CLOSED") {
                    hubStatus.innerText = "🛑 REALTIME SYNC: Getrennt";
                    hubStatus.style.borderColor = "#f75a68";
                    hubStatus.style.color = "#f75a68";
                }
            });
    }

    // Beim Laden der Seite wird nun zuerst die Konfiguration sicher injiziert
    window.addEventListener("load", fetchSecureConfig);
</script>

</body>
</html>
