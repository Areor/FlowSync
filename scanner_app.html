<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowSync — Mobile Warehouse Terminal</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #121214;
            color: #e1e1e6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #202024;
            border-radius: 8px;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h2 { margin-top: 0; color: #04d361; text-align: center; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #a8a8b3; font-size: 14px; }
        input, select {
            width: 100%;
            padding: 12px;
            background: #121214;
            border: 1px solid #29292e;
            border-radius: 4px;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus, select:focus { border-color: #04d361; outline: none; }
        button {
            width: 100%;
            padding: 14px;
            background: #04d361;
            border: none;
            border-radius: 4px;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #00b34d; }
        .queue-badge {
            text-align: center;
            margin: 10px 0;
            font-size: 14px;
            font-weight: bold;
            color: #ff9000;
            display: none;
        }
        .log-panel {
            margin-top: 20px;
            background: #121214;
            border-radius: 4px;
            padding: 10px;
            height: 150px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            border: 1px solid #29292e;
        }
        .log-entry { margin-bottom: 5px; padding-bottom: 5px; border-bottom: 1px solid #202024; }
        .success { color: #04d361; }
        .error { color: #f75a68; }
        .info { color: #4da6ff; }
        .warn { color: #ff9000; }
    </style>
</head>
<body>

<div class="container">
    <h2>FlowSync Terminal</h2>
    
    <div class="input-group">
        <label for="deviceId">Geräte-ID (Terminal)</label>
        <input type="text" id="deviceId" value="SCANNER_RAMPE_A" readonly>
    </div>

    <div class="input-group">
        <label for="scanType">Aktivität / Status</label>
        <select id="scanType">
            <option value="WARENEINGANG">WARENEINGANG (Erhalt)</option>
            <option value="BELADUNG">BELADUNG (Lkw Verladung)</option>
        </select>
    </div>

    <div class="input-group">
        <label for="barcodeInput">Barcode scannen / eintippen</label>
        <input type="text" id="barcodeInput" placeholder="Z.B. AUFTRAG-1001" autofocus>
    </div>

    <button id="submitBtn">Barcode erfassen</button>
    <div class="queue-badge" id="queueBadge">⚠️ Offline: 0 Scans in Warteschlange</div>

    <div class="log-panel" id="logPanel">
        <div class="log-entry info">[SYSTEM] Terminal bereit. Warte auf Eingabe...</div>
    </div>
</div>

<script>
    const API_URL = "http://localhost:8000/api/v1/warehouse/scans";
    const STORAGE_KEY = "flowsync_scan_queue";

    const barcodeInput = document.getElementById("barcodeInput");
    const scanTypeSelect = document.getElementById("scanType");
    const deviceIdInput = document.getElementById("deviceId");
    const submitBtn = document.getElementById("submitBtn");
    const logPanel = document.getElementById("logPanel");
    const queueBadge = document.getElementById("queueBadge");

    let isSyncing = false;

    function logToUI(message, type = "info") {
        const entry = document.createElement("div");
        entry.className = `log-entry ${type}`;
        const time = new Date().toLocaleTimeString();
        entry.innerText = `[${time}] ${message}`;
        logPanel.insertBefore(entry, logPanel.firstChild);
    }

    function generateUUID() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
        });
    }

    function getQueue() {
        try {
            const queue = localStorage.getItem(STORAGE_KEY);
            return queue ? JSON.parse(queue) : [];
        } catch (e) {
            return [];
        }
    }

    // GEHÄRTET: Zwingt den Browser zum sofortigen HDD-Schreiben via JSON-Sicherung
    function saveQueue(queue) {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(queue));
            // Ein tiefer Lese-Check garantiert, dass die Daten physisch existieren
            const verify = localStorage.getItem(STORAGE_KEY);
            updateQueueUI(queue.length);
        } catch (e) {
            logToUI(`❌ Kritischer Speicherfehler im Browser!`, "error");
        }
    }

    function updateQueueUI(count) {
        if (count > 0) {
            queueBadge.style.display = "block";
            queueBadge.innerText = `⚠️ Offline-Modus: ${count} Scan(s) gepuffert`;
        } else {
            queueBadge.style.display = "none";
        }
    }

    function handleOfflineFallback(payload) {
        const queue = getQueue();
        queue.push(payload); 
        saveQueue(queue);
        logToUI(`📦 CRASH-PROTECT: Lokal gesichert (${payload.barcode}).`, "warn");
    }

    async function syncQueue() {
        if (isSyncing) return;
        const queue = getQueue();
        if (queue.length === 0) return;

        isSyncing = true;
        logToUI(`🔄 Sync-Schleife gestartet für ${queue.length} Scans...`, "info");

        while (queue.length > 0) {
            const currentScan = queue[0]; 
            
            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(currentScan)
                });

                if (response.status === 201 || response.status === 200) {
                    queue.shift(); 
                    saveQueue(queue);
                    logToUI(`🚀 Sync erfolgreich: ${currentScan.barcode}`, "success");
                } else {
                    logToUI(`⚠️ Sync blockiert. Status: ${response.status}`, "warn");
                    break; 
                }
            } catch (error) {
                break;
            }
        }
        isSyncing = false;
    }

    async function sendScanToCloud(payload) {
        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (response.status === 201) {
                logToUI(`🟢 Live-Erfolg: ${payload.barcode} gespeichert.`, "success");
                return true;
            } else if (response.status === 200) {
                logToUI(`🛑 Idempotenz: Duplikat ignoriert (${payload.barcode}).`, "success");
                return true;
            } else {
                logToUI(`❌ Server-Fehler: ${response.status}`, "error");
                return false;
            }
        } catch (error) {
            logToUI(`❌ Verbindungsfehler. Cloud offline.`, "error");
            handleOfflineFallback(payload); 
            return false;
        }
    }

    async function processScan() {
        const barcode = barcodeInput.value.trim();
        if (!barcode) return;

        const startTime = performance.now();
        const timestamp = Date.now();
        const rowUuid = generateUUID();
        const deviceId = deviceIdInput.value;
        const compositeKey = `SC-${deviceId}-${timestamp}-${rowUuid}`;

        const payload = {
            unique_scan_id: compositeKey,
            device_id: deviceId,
            timestamp: timestamp,
            uuid: rowUuid,
            barcode: barcode,
            scan_type: scanTypeSelect.value,
            scan_duration_sec: parseFloat(((performance.now() - startTime) / 1000).toFixed(2))
        };

        if (getQueue().length > 0) {
            handleOfflineFallback(payload);
            syncQueue();
        } else {
            await sendScanToCloud(payload);
        }

        barcodeInput.value = "";
        barcodeInput.focus();
    }

    submitBtn.addEventListener("click", processScan);
    barcodeInput.addEventListener("keypress", function(e) {
        if (e.key === "Enter") processScan();
    });

    setInterval(syncQueue, 5000); // Intervall auf 5 Sekunden verkürzt für schnellere Reaktionen
    window.addEventListener("online", syncQueue);
    window.addEventListener("load", () => updateQueueUI(getQueue().length));

</script>

</body>
</html>
