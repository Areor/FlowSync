<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowSync Terminal</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; background: #121214; color: #e1e1e6; padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; }
        .camera-wrapper { position: relative; width: 100%; aspect-ratio: 4/3; background: #202024; border-radius: 8px; overflow: hidden; margin-bottom: 15px; }
        video { width: 100%; height: 100%; object-fit: cover; }
        button { width: 100%; padding: 15px; background: #00875f; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; }
        button.active { background: #ab222e; }
        .log-panel { background: #202024; padding: 15px; border-radius: 6px; margin-top: 15px; font-family: monospace; font-size: 13px; max-height: 150px; overflow-y: auto; }
        .log-entry { margin-bottom: 5px; color: #8d8d99; }
        .log-entry.error { color: #f75a68; }
        .log-entry.info { color: #4cd62b; }
    </style>
</head>
<body>

<div class="container">
    <h2>FlowSync Terminal</h2>
    
    <div class="camera-wrapper">
        <video id="previewVideo" autoplay muted playsinline></video>
    </div>

    <button id="toggleCamBtn">📷 Kamera aktivieren</button>
    <!-- 🚀 UI-RESTORE: Holt die Laderampen-Auswahl und das Backup-Feld sicher zurück -->
    <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 12px;">
        <div>
            <label style="display: block; font-size: 12px; color: #8d8d99; margin-bottom: 4px;">Geräte-ID (Terminal)</label>
            <input type="text" id="deviceId" value="MOTOROLA_RAMPE_A" readonly style="width: 100%; padding: 12px; background: #202024; border: 1px solid #29292e; border-radius: 6px; color: #e1e1e6; font-weight: bold;">
        </div>

        <div>
            <label style="display: block; font-size: 12px; color: #8d8d99; margin-bottom: 4px;">Aktivität / Status</label>
            <select id="scanType" style="width: 100%; padding: 12px; background: #202024; border: 1px solid #29292e; border-radius: 6px; color: #e1e1e6; font-weight: bold;">
                <option value="WARENEINGANG">WARENEINGANG (Erhalt)</option>
                <option value="BELADUNG">BELADUNG (Versand)</option>
                <option value="INTERN">INTERN (Umlagerung)</option>
            </select>
        </div>

        <div style="border-top: 1px solid #29292e; padding-top: 12px; margin-top: 4px;">
            <label style="display: block; font-size: 12px; color: #8d8d99; margin-bottom: 4px;">Manueller Backup-Eingang</label>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="barcodeInput" placeholder="Z.B. AUFTRAG-1001" style="flex: 1; padding: 12px; background: #121214; border: 1px solid #29292e; border-radius: 6px; color: #e1e1e6;">
                <button id="submitBtn" style="width: auto; padding: 0 20px; background: #29292e;">Erfassen</button>
            </div>
        </div>
    </div>
    <div class="log-panel" id="logPanel">
        <div class="log-entry info">[SYSTEM] Ballast abgeworfen. Datei-Größe minimiert.</div>
    </div>
</div>
<script>
    const video = document.getElementById("previewVideo");
    const toggleCamBtn = document.getElementById("toggleCamBtn");
    const logPanel = document.getElementById("logPanel");
    
    // 🚀 UI-RESTORE VARS: Bindung der neu hinzugefügten Steuerungselemente
    const barcodeInput = document.getElementById("barcodeInput");
    const scanTypeSelect = document.getElementById("scanType");
    const deviceIdInput = document.getElementById("deviceId");
    const submitBtn = document.getElementById("submitBtn");

    let streamInstance = null;
    let isCameraActive = false;
    let scanIntervalId = null;
    let barcodeDetector = null;

    function logToUI(message, type = "") {
        const entry = document.createElement("div");
        entry.className = `log-entry ${type}`;
        const time = new Date().toLocaleTimeString();
        entry.innerText = `[${time}] ${message}`;
        logPanel.insertBefore(entry, logPanel.firstChild);
    }

    // 🔐 HARDWARE-CHECK: Überprüft die native Google-Schnittstelle im Browser-RAM
    if ('BarcodeDetector' in window) {
        barcodeDetector = new BarcodeDetector({ 
            formats: ['qr_code', 'code_128', 'ean_13'] 
        });
        logToUI("🟢 Native Android-Hardware-Erkennung einsatzbereit!", "info");
    } else {
        logToUI("⚠️ Native API nicht direkt aktiv. Prüfe die Browser-Einstellungen.", "error");
    }

    // 📝 MANUAL PIPELINE: Verarbeitet manuelle Tastatur-Eingaben über den Backup-Button
    async function processManualInput() {
        const barcodeText = barcodeInput.value.trim();
        if (!barcodeText) { logToUI("⚠️ Eingabefeld ist leer!", "error"); return; }
        
        logToUI(`📦 Erfasse manuell: ${barcodeText}`);
        sendScanToBackend(barcodeText);
        barcodeInput.value = ""; // Leert das Feld nach erfolgreicher Übergabe
    }

    function logToUI(message, type = "") {
        const entry = document.createElement("div");
        entry.className = `log-entry ${type}`;
        const time = new Date().toLocaleTimeString();
        entry.innerText = `[${time}] ${message}`;
        logPanel.insertBefore(entry, logPanel.firstChild);
    }

    // 🔐 HARDWARE-CHECK: Überprüft die native Google-Schnittstelle im Browser-RAM
    if ('BarcodeDetector' in window) {
        // Erkennt QR-Codes sowie industrielle Barcodes im Logistik-Standard
        barcodeDetector = new BarcodeDetector({ 
            formats: ['qr_code', 'code_128', 'ean_13'] 
        });
        logToUI("🟢 Native Android-Hardware-Erkennung einsatzbereit!", "info");
    } else {
        logToUI("⚠️ Native API nicht direkt aktiv. Prüfe die Browser-Einstellungen.", "error");
    }
     async function toggleCamera() {
        if (isCameraActive) { stopCamera(); return; }
        logToUI("📷 Fordere Kamera-Stream an...");
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment" }, audio: false
            });
            video.srcObject = stream;
            streamInstance = stream;
            isCameraActive = true;
            toggleCamBtn.innerText = "🛑 Kamera stoppen";
            toggleCamBtn.classList.add("active");
            logToUI("🟢 Kamera erfolgreich gestartet!", "info");

            // 🛰️ NATIVE DATEN-PIPELINE: Analysiert das Live-Bild blockierungsfrei
            if (barcodeDetector) {
                scanIntervalId = setInterval(async function() {
                    if (!isCameraActive) return;
                    try {
                        const barcodes = await barcodeDetector.detect(video);
                        if (barcodes.length > 0) {
                            const barcode = barcodes[0]; // Greift den ersten erkannten Code im Array
                            logToUI(`🎉 CODE ERKANNT: ${barcode.rawValue}`, "info");
                            if (navigator.vibrate) navigator.vibrate(100);

                            // Erstellt das payload-konforme B2B-Datenpaket
                            const timestamp = Date.now();
                            const uuid = Math.random().toString(36).substring(2, 11).toUpperCase();
                            
                            fetch(window.location.origin + "/api/v1/warehouse/scans", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({
                                    unique_scan_id: `MOBILE_${timestamp}_${uuid}`,
                                    device_id: "MOTOROLA_RAMPE_A",
                                    timestamp: timestamp,
                                    uuid: uuid,
                                    barcode: barcode.rawValue,
                                    scan_duration_sec: 0.05,
                                    scan_type: "WARENEINGANG"
                                })
                            }).then(function(res) {
                                if (res.ok) logToUI(`🚀 Cloud-Sync erfolgreich: ${barcode.rawValue}`, "info");
                            }).catch(function(err) { console.error("Pipeline-Stau:", err); });
                        }
                    } catch (e) { /* Geräuschlose Abfangung */ }
                }, 300);
            }
        } catch (err) { logToUI("❌ Zugriff fehlgeschlagen: " + err.message, "error"); }
    }

    function stopCamera() {
        if (scanIntervalId) { clearInterval(scanIntervalId); scanIntervalId = null; }
        if (streamInstance) { streamInstance.getTracks().forEach(track => track.stop()); }
        video.srcObject = null; streamInstance = null; isCameraActive = false;
        toggleCamBtn.innerText = "📷 Kamera aktivieren"; toggleCamBtn.classList.remove("active");
        logToUI("📷 Kamera-Stream gestoppt.");
    }
    // ==============================================================================
    // 💾 OFFLINE-FIRST STORAGE AUTOMATION (Kupfert Datenverluste im Funkloch ab)
    // ==============================================================================
    const DB_NAME = "FlowSyncStorage";
    const STORE_NAME = "offline_queue";
    let dbInstance = null;
    let isSyncing = false;

    // Initialisiert eine transaktionsgesicherte NoSQL-Datenbank direkt im Handy-RAM
    function initDatabase() {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = function(e) {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME, { keyPath: "unique_scan_id" });
            }
        };
        request.onsuccess = function(e) {
            dbInstance = e.target.result;
            logToUI("💾 Lokaler OS-Ausfallspeicher aktiv.", "info");
            // Versucht sofort, eventuelle Altlasten nachzusynchronisieren
            syncOfflineQueue();
        };
    }

    // Klinkt die Datenbank direkt in den Startprozess des Browsers ein
    window.addEventListener("load", initDatabase);

    / ⚡ RESILIENT PIPELINE: Schießt Daten live ins Netz oder parkt sie lokal im RAM
    function sendScanToBackend(scannedText) {
        const timestamp = Date.now();
        const uuid = Math.random().toString(36).substring(2, 11).toUpperCase();
        const scanPayload = {
            unique_scan_id: `MOBILE_${timestamp}_${uuid}`,
            device_id: deviceIdInput.value,
            timestamp: timestamp,
            uuid: uuid,
            barcode: scannedText,
            scan_duration_sec: 0.05,
            scan_type: scanTypeSelect.value
        };

        // Versuch A: Live-Übertragung an das FastAPI-Gateway
        fetch(window.location.origin + "/api/v1/warehouse/scans", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(scanPayload)
        }).then(function(res) {
            if (res.ok) logToUI(`🚀 Cloud-Sync erfolgreich: ${scannedText}`, "info");
            else throw new Error("Server-Stau");
        }).catch(function(err) {
            // 🚨 FALLBACK-ZÜNDUNG: Bei Funkloch oder ngrok-Abriss lokal wegspeichern
            logToUI(`⚠️ Netz-Blackout! Parke im Speicher: ${scannedText}`, "error");
            if (dbInstance) {
                const tx = dbInstance.transaction(STORE_NAME, "readwrite");
                tx.objectStore(STORE_NAME).add(scanPayload);
                tx.onsuccess = function() { syncOfflineQueue(); };
            }
        });
    }

    // 🛰️ AUTO-SYNC SATELLITE: Arbeitet im Hintergrund die Warteschlange ab
    function syncOfflineQueue() {
        if (isSyncing || !navigator.onLine || !dbInstance) return;
        isSyncing = true;

        const tx = dbInstance.transaction(STORE_NAME, "readonly");
        tx.objectStore(STORE_NAME).getAll().onsuccess = function(e) {
            const records = e.target.result;
            if (records.length === 0) { isSyncing = false; return; }

            // Schnappt sich das älteste wartende Paket (FIFO-Prinzip)
            const record = records[0];
            fetch(window.location.origin + "/api/v1/warehouse/scans", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(record)
            }).then(function(res) {
                if (res.ok) {
                    const delTx = dbInstance.transaction(STORE_NAME, "readwrite");
                    delTx.objectStore(STORE_NAME).delete(record.unique_scan_id).onsuccess = function() {
                        logToUI(`🔄 Warteschlange synchronisiert: ${record.barcode}`, "info");
                        isSyncing = false;
                        setTimeout(syncOfflineQueue, 500); // Nächstes Paket abarbeiten
                    };
                } else { isSyncing = false; }
            }).catch(function() { isSyncing = false; });
        };
    }

    // Lauscht auf die Netzwerkhardware: Sobald Wi-Fi zurückkehrt, wird gepusht
    window.addEventListener("online", syncOfflineQueue);

    // Event-Listener für den manuellen Erfassungs-Button verankern
    submitBtn.addEventListener("click", processManualInput);

    toggleCamBtn.addEventListener("click", toggleCamera);
</script>
</body>
</html>
